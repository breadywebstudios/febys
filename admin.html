<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#fbf9f4">
<meta name="robots" content="noindex">
<title>Febys Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="site-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

</head>
<body class="admin-page">

<!-- ============ LOGIN ============ -->
<section class="login hidden" id="loginView">
  <div class="login-card">
    <div class="mark"><span>Febys</span></div>
    <h1>Menu Admin</h1>
    <p class="sub" id="loginSub">Sign in to manage the Febys menu.</p>
    <form id="loginForm">
      <label class="f">Email<input type="email" name="email" required autocomplete="username"></label>
      <label class="f" id="pwWrap">Password<input type="password" name="password" required autocomplete="current-password" minlength="6"></label>
      <div id="loginMsg"></div>
      <button class="btn" type="submit" id="loginBtn">Sign in</button>
    </form>
    <div class="links">
      <button type="button" id="modeBack" class="hidden">Back to sign in</button>
      <button type="button" id="modeReset">Forgot password</button>
    </div>
  </div>
</section>

<!-- ============ NOT AN ADMIN ============ -->
<section class="login hidden" id="deniedView">
  <div class="login-card">
    <div class="mark"><span>Febys</span></div>
    <h1>No access yet</h1>
    <p class="sub"><span id="deniedEmail"></span> isn't on the Febys admin list. Ask an existing admin to add you, then sign in again.</p>
    <button class="btn ghost" id="deniedOut">Sign out</button>
  </div>
</section>

<!-- ============ APP ============ -->
<div class="hidden" id="appView">
  <header>
    <div class="bar">
      <div class="mark"><span>Febys</span></div>
      <h1>Febys<small>Menu admin</small></h1>
      <div class="grow"></div>
      <a class="btn ghost sm" href="index.html" target="_blank" rel="noopener">View site ↗</a>
      <span class="who" id="who"></span>
      <button class="btn ghost sm" id="signOut">Sign out</button>
    </div>
    <nav class="tabs">
      <button data-tab="orders" class="on">Orders <span class="nbadge hidden" id="newBadge">0</span></button>
      <button data-tab="menu">Menu</button>
      <button data-tab="reviews">Reviews</button>
      <button data-tab="gallery">Gallery</button>
      <button data-tab="settings">Banner &amp; settings</button>
      <button data-tab="admins">Admins</button>
    </nav>
  </header>
  <main>
    <div id="tab-orders"></div>
    <div id="tab-menu" class="hidden"></div>
    <div id="tab-reviews" class="hidden"></div>
    <div id="tab-gallery" class="hidden"></div>
    <div id="tab-settings" class="hidden"></div>
    <div id="tab-admins" class="hidden"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>


<script src="script.js"></script>
</body>
</html>
